apiVersion: 1

providers:
  - name: "Kraken Copilot Observability"
    orgId: 1
    folder: "Kraken Copilot"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/kraken-copilot
      foldersFromFilesStructure: false

