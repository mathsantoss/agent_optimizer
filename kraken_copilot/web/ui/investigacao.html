<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Investigação e Observabilidade | Kraken Copilot</title>
  <link rel="icon" type="image/svg+xml" href="/web/ui/kraken-copilot.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-sans@5/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-sans@5/400-italic.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/recursive@5/index.css" />
  <link rel="stylesheet" href="/web/ui/app.css">
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12/dist/mermaid.esm.min.mjs';
    window.mermaid = mermaid;
    try {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'default',
        securityLevel: 'loose'
      });
    } catch (_) {}
  </script>
  <script src="/web/ui/app.js" defer></script>
</head>
<body data-view="investigacao">
  <a class="skip" href="#principal">Ir para a investigação</a>
  
  <header class="inspection-header">
    <div class="inspection-shell">
      <a class="brand" href="/" aria-label="Kraken Copilot, início">
        <img class="brand-mark" src="/web/ui/kraken-copilot.svg" alt="" width="36" height="36">
        <span>Kraken <strong>Copilot</strong></span>
      </a>
      <a class="back-link" id="nav-voltar" href="/"><span aria-hidden="true">←</span> Voltar à conversa</a>
    </div>
  </header>

  <main class="inspection-shell inspection-main" id="principal" tabindex="-1" aria-labelledby="titulo">
    <div class="inspection-heading">
      <div>
        <p class="eyebrow">Auditoria, Guardrails & OpenTelemetry</p>
        <h1 id="titulo">Investigação da Execução</h1>
      </div>
      <button class="button" id="atualizar-btn" type="button">Atualizar</button>
    </div>

    <div id="investigacao-conteudo" aria-busy="true">
      <p class="empty">Carregando telemetria da execução…</p>
    </div>
  </main>
</body>
</html>
